<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>钓鱼潮汐助手</title>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <div id="app">
    <!-- 顶部栏 -->
    <header class="header">
      <div class="header-top">
        <h1>🎣 钓鱼潮汐助手</h1>
        <div class="date-nav">
          <button id="prevDay" class="btn-icon">◀</button>
          <span id="dateDisplay"></span>
          <button id="nextDay" class="btn-icon">▶</button>
          <button id="todayBtn" class="btn-today">今天</button>
        </div>
      </div>
      <div class="station-selector">
        <select id="stationSelect"></select>
      </div>
    </header>

    <!-- 加载指示 -->
    <div id="loadingBar" class="loading-bar hidden"></div>

    <!-- 主要内容 -->
    <main class="main-content">

      <!-- 天气卡片 -->
      <section class="card weather-card" id="weatherCard">
        <div class="card-header">
          <span class="card-title">🌤 天气</span>
        </div>
        <div id="weatherContent" class="weather-content">
          <div id="weatherLoading" class="mini-loading">加载天气数据中...</div>
        </div>
      </section>

      <!-- 潮汐信息卡片 -->
      <section class="card tide-card">
        <div class="card-header">
          <span class="card-title">🌊 潮汐信息</span>
          <span id="tideType" class="tide-type-badge"></span>
        </div>

        <!-- 潮汐曲线 -->
        <div class="chart-container">
          <canvas id="tideChart" width="700" height="240"></canvas>
        </div>

        <!-- 潮汐数据表格 -->
        <div class="tide-extremes" id="tideExtremes">
          <div class="mini-loading">计算潮汐数据中...</div>
        </div>
      </section>

      <!-- 钓鱼指数卡片 -->
      <section class="card fish-card">
        <div class="card-header">
          <span class="card-title">🎯 钓鱼指数</span>
        </div>
        <div id="fishIndexContent">
          <div class="mini-loading">计算中...</div>
        </div>
      </section>

      <!-- 天文信息卡片 -->
      <section class="card astro-card">
        <div class="card-header">
          <span class="card-title">🌙 天文信息</span>
        </div>
        <div id="astroContent" class="astro-content">
          <div class="mini-loading">计算中...</div>
        </div>
      </section>

    </main>

    <footer class="footer">
      <p>数据仅供参考，钓鱼请注意安全</p>
    </footer>
  </div>

  <script src="js/stations.js"></script>
  <script src="js/tide.js"></script>
  <script src="js/astronomy.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
